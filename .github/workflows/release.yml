name: Release

# Push a version tag (e.g. "git tag v0.3.0 && git push origin v0.3.0") to publish a release
# with a ready-to-upload archive, built by scripts/build-release.sh.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/build-release.sh "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/avunculus-*.zip
            dist/avunculus-*.zip.sha256
          generate_release_notes: true
